
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Maker Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101326;color:white;font-family:Arial,sans-serif;padding:20px}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#8b9cff}
.card{background:#1c2140;padding:18px;border-radius:15px;margin-top:18px}
label{display:block;margin:14px 0 7px}
textarea,select{width:100%;padding:13px;border-radius:9px;border:0;background:#303858;color:white;font-size:16px}
textarea{height:110px}
button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:10px;background:#655cff;color:white;font-size:17px;font-weight:bold}
.output{white-space:pre-wrap;line-height:1.6;background:#101326;padding:14px;border-radius:10px;margin-top:15px;min-height:60px}
.small{text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>🎬 AI VIDEO MAKER PRO</h1>
<p class="small">Create amazing video scripts and AI prompts</p>

<div class="card">
<label>Enter Your Video Topic</label>
<textarea id="topic" placeholder="Example: What happens inside a black hole?"></textarea>

<label>Video Language</label>
<select id="lang">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
</select>

<label>Video Format</label>
<select id="format">
<option value="9:16">YouTube Shorts (9:16)</option>
<option value="16:9">YouTube Video (16:9)</option>
</select>

<label>Video Duration</label>
<select id="duration">
<option>30 Seconds</option>
<option>60 Seconds</option>
</select>

<button onclick="generate()">Generate Video Prompt</button>
</div>

<div class="card">
<h3>✨ Your Video Plan</h3>
<div id="output" class="output">Your video plan will appear here...</div>
<button onclick="copyText()">Copy Video Plan</button>
<button onclick="makeVoice()">🔊 Listen to Voice</button>
</div>

<p class="small">AI Video Maker Pro | Version 1.0</p>
</div>

<script>
function generate(){
let topic=document.getElementById("topic").value.trim();
let lang=document.getElementById("lang").value;
let format=document.getElementById("format").value;
let duration=document.getElementById("duration").value;
if(!topic){alert("Please enter a video topic!");return;}
let text=`AI VIDEO MAKER PRO

TOPIC: ${topic}
LANGUAGE: ${lang}
FORMAT: ${format}
DURATION: ${duration}

SCENE 1 - HOOK
Create a powerful opening scene about ${topic}. Use cinematic camera movement and realistic visuals.

SCENE 2 - EXPLANATION
Show detailed realistic visuals explaining ${topic}. Use dramatic lighting and smooth camera movement.

SCENE 3 - AMAZING FACT
Show an impressive visual fact about ${topic}. Use 4K documentary style.

SCENE 4 - ENDING
Create a memorable ending with cinematic visuals.

VOICEOVER:
Write an engaging ${lang} narration about ${topic}, suitable for a ${duration} video.

EDITING:
Use smooth transitions, background music, subtitles and sound effects.

VIDEO QUALITY:
Ultra realistic, cinematic, 4K.
Aspect ratio: ${format}`;
document.getElementById("output").innerText=text;
}
function copyText(){
let text=document.getElementById("output").innerText;
if(!text || text.includes("will appear")){alert("Generate a video plan first");return;}
navigator.clipboard.writeText(text).then(()=>alert("Copied successfully!")).catch(()=>alert("Please select and copy the text manually."));
}
function makeVoice(){
let text=document.getElementById("output").innerText;
if(!text || text.includes("will appear")){alert("Generate a video plan first");return;}
let speech=new SpeechSynthesisUtterance(text);
speech.lang=document.getElementById("lang").value==="Hindi"?"hi-IN":"en-US";
speechSynthesis.cancel();
speechSynthesis.speak(speech);
}
function downloadVoice(){
  const text = document.getElementById("output").innerText;
  if(!text || text.includes("will appear")){
    alert("Please generate a video plan first");
    return;
  }

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = document.getElementById("lang").value === "Hindi"
    ? "hi-IN" : "en-US";

  speech.onend = function(){
    alert("Voice playback completed!");
  };

  speechSynthesis.speak(speech);
}

function downloadPlan(){
  const text = document.getElementById("output").innerText;
  if(!text || text.includes("will appear")){
    alert("Generate a video plan first");
    return;
  }

  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "AI-Video-Plan.txt";
  a.click();
  URL.revokeObjectURL(url);
}

</script>
</body>
</html>
